<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: #0a0a0a;">
  <!-- Title -->
  <text x="400" y="40" font-family="monospace" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">HFT ORDERBOOK ENGINE</text>

  <!-- Orderbook visualization -->
  <g id="orderbook">
    <!-- Headers -->
    <text x="150" y="90" font-family="monospace" font-size="16" fill="#ff3333" text-anchor="middle" font-weight="bold">BIDS</text>
    <text x="400" y="90" font-family="monospace" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">PRICE</text>
    <text x="650" y="90" font-family="monospace" font-size="16" fill="#33ff33" text-anchor="middle" font-weight="bold">ASKS</text>

    <!-- Bid side (red) -->
    <rect x="50" y="110" width="180" height="20" fill="#ff3333" opacity="0.8"/>
    <text x="60" y="125" font-family="monospace" font-size="14" fill="#fff">1250.5</text>
    <text x="200" y="125" font-family="monospace" font-size="14" fill="#fff" text-anchor="end">100</text>

    <rect x="50" y="140" width="160" height="20" fill="#ff3333" opacity="0.7"/>
    <text x="60" y="155" font-family="monospace" font-size="14" fill="#fff">1250.0</text>
    <text x="200" y="155" font-family="monospace" font-size="14" fill="#fff" text-anchor="end">85</text>

    <rect x="50" y="170" width="140" height="20" fill="#ff3333" opacity="0.6"/>
    <text x="60" y="185" font-family="monospace" font-size="14" fill="#fff">1249.5</text>
    <text x="200" y="185" font-family="monospace" font-size="14" fill="#fff" text-anchor="end">72</text>

    <rect x="50" y="200" width="120" height="20" fill="#ff3333" opacity="0.5"/>
    <text x="60" y="215" font-family="monospace" font-size="14" fill="#fff">1249.0</text>
    <text x="200" y="215" font-family="monospace" font-size="14" fill="#fff" text-anchor="end">60</text>

    <rect x="50" y="230" width="100" height="20" fill="#ff3333" opacity="0.4"/>
    <text x="60" y="245" font-family="monospace" font-size="14" fill="#fff">1248.5</text>
    <text x="200" y="245" font-family="monospace" font-size="14" fill="#fff" text-anchor="end">50</text>

    <!-- Center line -->
    <line x1="250" y1="100" x2="250" y2="450" stroke="#666" stroke-width="2"/>
    <line x1="550" y1="100" x2="550" y2="450" stroke="#666" stroke-width="2"/>

    <!-- Middle price indicator -->
    <rect x="300" y="260" width="200" height="30" fill="#ffff00" opacity="0.3" stroke="#ffff00" stroke-width="2"/>
    <text x="400" y="282" font-family="monospace" font-size="18" fill="#ffff00" text-anchor="middle" font-weight="bold">1251.25</text>

    <!-- Ask side (green) -->
    <rect x="570" y="110" width="180" height="20" fill="#33ff33" opacity="0.8"/>
    <text x="590" y="125" font-family="monospace" font-size="14" fill="#000">1252.0</text>
    <text x="740" y="125" font-family="monospace" font-size="14" fill="#000" text-anchor="end">110</text>

    <rect x="570" y="140" width="160" height="20" fill="#33ff33" opacity="0.7"/>
    <text x="590" y="155" font-family="monospace" font-size="14" fill="#000">1252.5</text>
    <text x="740" y="155" font-family="monospace" font-size="14" fill="#000" text-anchor="end">95</text>

    <rect x="570" y="170" width="140" height="20" fill="#33ff33" opacity="0.6"/>
    <text x="590" y="185" font-family="monospace" font-size="14" fill="#000">1253.0</text>
    <text x="740" y="185" font-family="monospace" font-size="14" fill="#000" text-anchor="end">80</text>

    <rect x="570" y="200" width="120" height="20" fill="#33ff33" opacity="0.5"/>
    <text x="590" y="215" font-family="monospace" font-size="14" fill="#000">1253.5</text>
    <text x="740" y="215" font-family="monospace" font-size="14" fill="#000" text-anchor="end">65</text>

    <rect x="570" y="230" width="100" height="20" fill="#33ff33" opacity="0.4"/>
    <text x="590" y="245" font-family="monospace" font-size="14" fill="#000">1254.0</text>
    <text x="740" y="245" font-family="monospace" font-size="14" fill="#000" text-anchor="end">55</text>
  </g>

  <!-- Performance metrics -->
  <g id="metrics">
    <rect x="50" y="320" width="700" height="240" fill="#111" stroke="#333" stroke-width="2" rx="8"/>

    <text x="400" y="350" font-family="monospace" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">PERFORMANCE METRICS</text>

    <text x="80" y="385" font-family="monospace" font-size="14" fill="#888">LATENCY:</text>
    <text x="250" y="385" font-family="monospace" font-size="14" fill="#33ff33" font-weight="bold">~2.3μs</text>

    <text x="80" y="415" font-family="monospace" font-size="14" fill="#888">THROUGHPUT:</text>
    <text x="250" y="415" font-family="monospace" font-size="14" fill="#33ff33" font-weight="bold">500K ops/sec</text>

    <text x="80" y="445" font-family="monospace" font-size="14" fill="#888">ORDER MATCHING:</text>
    <text x="250" y="445" font-family="monospace" font-size="14" fill="#33ff33" font-weight="bold">FIFO</text>

    <text x="420" y="385" font-family="monospace" font-size="14" fill="#888">MEMORY:</text>
    <text x="550" y="385" font-family="monospace" font-size="14" fill="#33ff33" font-weight="bold">Cache-efficient</text>

    <text x="420" y="415" font-family="monospace" font-size="14" fill="#888">PRECISION:</text>
    <text x="550" y="415" font-family="monospace" font-size="14" fill="#33ff33" font-weight="bold">Nanosecond</text>

    <text x="420" y="445" font-family="monospace" font-size="14" fill="#888">ARCHITECTURE:</text>
    <text x="550" y="445" font-family="monospace" font-size="14" fill="#33ff33" font-weight="bold">Lock-free</text>

    <!-- Tech stack -->
    <line x1="70" y1="470" x2="730" y2="470" stroke="#333" stroke-width="1"/>
    <text x="80" y="495" font-family="monospace" font-size="13" fill="#666">C++20</text>
    <text x="160" y="495" font-family="monospace" font-size="13" fill="#666">Modern STL</text>
    <text x="280" y="495" font-family="monospace" font-size="13" fill="#666">Cache-aware</text>
    <text x="420" y="495" font-family="monospace" font-size="13" fill="#666">Zero-copy</text>
    <text x="540" y="495" font-family="monospace" font-size="13" fill="#666">Benchmarking</text>

    <text x="80" y="520" font-family="monospace" font-size="13" fill="#666">Limit Orders</text>
    <text x="200" y="520" font-family="monospace" font-size="13" fill="#666">Market Orders</text>
    <text x="360" y="520" font-family="monospace" font-size="13" fill="#666">Trade Aggregation</text>
    <text x="560" y="520" font-family="monospace" font-size="13" fill="#666">Spread Detection</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="5" fill="#ff3333" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="30" r="5" fill="#33ff33" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>