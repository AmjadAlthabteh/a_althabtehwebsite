<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background: #111118;">

  <!-- App chrome / top bar -->
  <rect x="0" y="0" width="800" height="36" fill="#1a1a24"/>
  <circle cx="18" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="6" fill="#febc2e"/>
  <circle cx="54" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#888" text-anchor="middle" letter-spacing="2">MAPLE — CINEMATIC EDITOR</text>

  <!-- Left panel: media bin -->
  <rect x="0" y="36" width="160" height="380" fill="#14141c"/>
  <rect x="0" y="36" width="160" height="28" fill="#1e1e2a"/>
  <text x="80" y="54" font-family="monospace" font-size="10" fill="#666" text-anchor="middle" letter-spacing="1">MEDIA BIN</text>

  <!-- Thumbnail items in media bin -->
  <rect x="8" y="72" width="144" height="68" rx="4" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <rect x="8" y="72" width="144" height="44" rx="4" fill="#0d1520"/>
  <!-- mini film frame -->
  <rect x="14" y="78" width="60" height="34" rx="2" fill="#1a2a40"/>
  <polygon points="34,88 34,104 52,96" fill="#3b82f6" opacity="0.8"/>
  <text x="82" y="90" font-family="monospace" font-size="9" fill="#aaa">scene_01.mp4</text>
  <text x="82" y="103" font-family="monospace" font-size="8" fill="#555">00:02:14  4K</text>
  <text x="14" y="130" font-family="monospace" font-size="8" fill="#3b82f6">▶ cinematic wide</text>

  <rect x="8" y="148" width="144" height="68" rx="4" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <rect x="8" y="148" width="144" height="44" rx="4" fill="#0d1520"/>
  <rect x="14" y="154" width="60" height="34" rx="2" fill="#1a1030"/>
  <polygon points="34,164 34,180 52,172" fill="#a855f7" opacity="0.8"/>
  <text x="82" y="166" font-family="monospace" font-size="9" fill="#aaa">scene_02.mp4</text>
  <text x="82" y="179" font-family="monospace" font-size="8" fill="#555">00:01:47  4K</text>
  <text x="14" y="206" font-family="monospace" font-size="8" fill="#a855f7">▶ close-up drama</text>

  <rect x="8" y="224" width="144" height="68" rx="4" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <rect x="8" y="224" width="144" height="44" rx="4" fill="#0d1520"/>
  <rect x="14" y="230" width="60" height="34" rx="2" fill="#102010"/>
  <polygon points="34,240 34,256 52,248" fill="#22c55e" opacity="0.8"/>
  <text x="82" y="242" font-family="monospace" font-size="9" fill="#aaa">scene_03.mp4</text>
  <text x="82" y="255" font-family="monospace" font-size="8" fill="#555">00:03:05  4K</text>
  <text x="14" y="282" font-family="monospace" font-size="8" fill="#22c55e">▶ aerial tracking</text>

  <rect x="8" y="300" width="144" height="50" rx="4" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <rect x="14" y="308" width="36" height="28" rx="2" fill="#201020"/>
  <text x="56" y="320" font-family="monospace" font-size="8" fill="#aaa">ambient_drone.wav</text>
  <text x="56" y="332" font-family="monospace" font-size="8" fill="#555">♫  02:30</text>
  <!-- waveform mini -->
  <polyline points="14,326 18,318 22,330 26,315 30,328 34,320 38,326 42,318 48,326" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Toolbar separator -->
  <line x1="160" y1="36" x2="160" y2="416" stroke="#2a2a3a" stroke-width="1"/>

  <!-- Center: preview monitor -->
  <rect x="160" y="36" width="480" height="280" fill="#0a0a10"/>
  <!-- Cinematic letterbox bars -->
  <rect x="160" y="36" width="480" height="32" fill="#000"/>
  <rect x="160" y="284" width="480" height="32" fill="#000"/>

  <!-- Scene content in monitor -->
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0520"/>
      <stop offset="60%" stop-color="#1a0a40"/>
      <stop offset="100%" stop-color="#2d1060"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a0a"/>
      <stop offset="100%" stop-color="#050a05"/>
    </linearGradient>
    <linearGradient id="glowV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="160" y="68" width="480" height="216" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <circle cx="210" cy="90" r="1" fill="white" opacity="0.6"/>
  <circle cx="260" cy="80" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="320" cy="95" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="390" cy="75" r="1" fill="white" opacity="0.7"/>
  <circle cx="450" cy="88" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="510" cy="78" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="570" cy="92" r="1" fill="white" opacity="0.7"/>
  <circle cx="610" cy="82" r="1.2" fill="white" opacity="0.8"/>

  <!-- Ground -->
  <rect x="160" y="224" width="480" height="60" fill="url(#groundGrad)"/>
  <!-- Horizon glow -->
  <ellipse cx="400" cy="224" rx="200" ry="12" fill="#7c3aed" opacity="0.25"/>

  <!-- Silhouette figure -->
  <rect x="388" y="196" width="4" height="28" fill="#000" opacity="0.9"/>
  <circle cx="390" cy="193" r="5" fill="#000" opacity="0.9"/>

  <!-- Light streak / lens flare -->
  <ellipse cx="520" cy="150" rx="60" ry="4" fill="#f59e0b" opacity="0.08" transform="rotate(-15, 520, 150)"/>
  <circle cx="520" cy="142" r="3" fill="#fff" opacity="0.5" filter="url(#glow)"/>

  <!-- Timecode overlay -->
  <text x="180" y="88" font-family="monospace" font-size="10" fill="#fff" opacity="0.6">01:23:45:12</text>
  <text x="550" y="88" font-family="monospace" font-size="10" fill="#fff" opacity="0.6" text-anchor="end">4K UHD  23.976fps</text>

  <!-- Playback controls bar -->
  <rect x="160" y="316" width="480" height="36" fill="#1a1a24"/>
  <text x="290" y="339" font-family="monospace" font-size="14" fill="#555" text-anchor="middle">⏮</text>
  <text x="330" y="339" font-family="monospace" font-size="14" fill="#aaa" text-anchor="middle">⏪</text>
  <circle cx="400" cy="334" r="12" fill="#3b82f6" opacity="0.9"/>
  <polygon points="396,328 396,340 408,334" fill="white"/>
  <text x="470" y="339" font-family="monospace" font-size="14" fill="#aaa" text-anchor="middle">⏩</text>
  <text x="510" y="339" font-family="monospace" font-size="14" fill="#555" text-anchor="middle">⏭</text>
  <text x="570" y="339" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">01:23:45</text>

  <!-- Right panel: inspector -->
  <rect x="640" y="36" width="160" height="380" fill="#14141c"/>
  <rect x="640" y="36" width="160" height="28" fill="#1e1e2a"/>
  <text x="720" y="54" font-family="monospace" font-size="10" fill="#666" text-anchor="middle" letter-spacing="1">INSPECTOR</text>
  <line x1="640" y1="64" x2="800" y2="64" stroke="#2a2a3a" stroke-width="1"/>

  <!-- Color grading wheels placeholder -->
  <text x="720" y="84" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">COLOR GRADE</text>
  <circle cx="680" cy="120" r="26" fill="none" stroke="#1e1e2e" stroke-width="12"/>
  <circle cx="680" cy="120" r="26" fill="none" stroke="#1a3a5c" stroke-width="3" stroke-dasharray="60 105"/>
  <circle cx="680" cy="120" r="26" fill="none" stroke="#5c1a1a" stroke-width="3" stroke-dasharray="40 125" stroke-dashoffset="-60"/>
  <circle cx="680" cy="120" r="26" fill="none" stroke="#1a5c1a" stroke-width="3" stroke-dasharray="30 135" stroke-dashoffset="-100"/>
  <text x="680" y="124" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">LIFT</text>
  <circle cx="760" cy="120" r="26" fill="none" stroke="#1e1e2e" stroke-width="12"/>
  <circle cx="760" cy="120" r="26" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="70 95"/>
  <circle cx="760" cy="120" r="26" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="50 115" stroke-dashoffset="-70"/>
  <text x="760" y="124" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">GAMMA</text>

  <line x1="648" y1="160" x2="792" y2="160" stroke="#2a2a3a" stroke-width="1"/>

  <!-- LUT / grade settings -->
  <text x="648" y="178" font-family="monospace" font-size="9" fill="#555">LUT</text>
  <text x="790" y="178" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="end">Kodak 2383</text>
  <text x="648" y="196" font-family="monospace" font-size="9" fill="#555">EXPOSURE</text>
  <rect x="648" y="200" width="144" height="4" rx="2" fill="#2a2a3a"/>
  <rect x="648" y="200" width="90" height="4" rx="2" fill="#3b82f6"/>
  <text x="648" y="218" font-family="monospace" font-size="9" fill="#555">CONTRAST</text>
  <rect x="648" y="222" width="144" height="4" rx="2" fill="#2a2a3a"/>
  <rect x="648" y="222" width="110" height="4" rx="2" fill="#3b82f6"/>
  <text x="648" y="240" font-family="monospace" font-size="9" fill="#555">SATURATION</text>
  <rect x="648" y="244" width="144" height="4" rx="2" fill="#2a2a3a"/>
  <rect x="648" y="244" width="75" height="4" rx="2" fill="#a855f7"/>
  <text x="648" y="262" font-family="monospace" font-size="9" fill="#555">HIGHLIGHTS</text>
  <rect x="648" y="266" width="144" height="4" rx="2" fill="#2a2a3a"/>
  <rect x="648" y="266" width="50" height="4" rx="2" fill="#f59e0b"/>

  <line x1="648" y1="285" x2="792" y2="285" stroke="#2a2a3a" stroke-width="1"/>

  <text x="648" y="303" font-family="monospace" font-size="9" fill="#555">EFFECTS</text>
  <rect x="648" y="310" width="144" height="22" rx="3" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <text x="660" y="324" font-family="monospace" font-size="8" fill="#3b82f6">◆ Film Grain  32%</text>
  <rect x="648" y="336" width="144" height="22" rx="3" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <text x="660" y="350" font-family="monospace" font-size="8" fill="#a855f7">◆ Vignette  45%</text>
  <rect x="648" y="362" width="144" height="22" rx="3" fill="#1e1e2e" stroke="#2a2a3a" stroke-width="1"/>
  <text x="660" y="376" font-family="monospace" font-size="8" fill="#22c55e">◆ Sharpen  18%</text>

  <!-- Timeline section -->
  <rect x="0" y="416" width="800" height="184" fill="#0e0e16"/>
  <rect x="0" y="416" width="800" height="28" fill="#1a1a24"/>
  <text x="20" y="434" font-family="monospace" font-size="10" fill="#666" letter-spacing="1">TIMELINE</text>

  <!-- Timecode ruler -->
  <rect x="120" y="416" width="680" height="28" fill="#161620"/>
  <line x1="120" y1="444" x2="800" y2="444" stroke="#2a2a3a" stroke-width="1"/>
  <!-- tick marks and timecodes -->
  <line x1="200" y1="436" x2="200" y2="444" stroke="#444" stroke-width="1"/>
  <text x="200" y="433" font-family="monospace" font-size="7" fill="#444" text-anchor="middle">00:30</text>
  <line x1="320" y1="436" x2="320" y2="444" stroke="#444" stroke-width="1"/>
  <text x="320" y="433" font-family="monospace" font-size="7" fill="#444" text-anchor="middle">01:00</text>
  <line x1="440" y1="436" x2="440" y2="444" stroke="#444" stroke-width="1"/>
  <text x="440" y="433" font-family="monospace" font-size="7" fill="#444" text-anchor="middle">01:30</text>
  <line x1="560" y1="436" x2="560" y2="444" stroke="#444" stroke-width="1"/>
  <text x="560" y="433" font-family="monospace" font-size="7" fill="#444" text-anchor="middle">02:00</text>
  <line x1="680" y1="436" x2="680" y2="444" stroke="#444" stroke-width="1"/>
  <text x="680" y="433" font-family="monospace" font-size="7" fill="#444" text-anchor="middle">02:30</text>

  <!-- Track labels -->
  <rect x="0" y="444" width="120" height="30" fill="#161620" stroke="#2a2a3a" stroke-width="1"/>
  <text x="10" y="463" font-family="monospace" font-size="9" fill="#666">V1  ▶</text>
  <rect x="0" y="474" width="120" height="30" fill="#161620" stroke="#2a2a3a" stroke-width="1"/>
  <text x="10" y="493" font-family="monospace" font-size="9" fill="#666">V2  ▶</text>
  <rect x="0" y="504" width="120" height="30" fill="#161620" stroke="#2a2a3a" stroke-width="1"/>
  <text x="10" y="523" font-family="monospace" font-size="9" fill="#666">A1  ♫</text>
  <rect x="0" y="534" width="120" height="28" fill="#161620" stroke="#2a2a3a" stroke-width="1"/>
  <text x="10" y="552" font-family="monospace" font-size="9" fill="#666">A2  ♫</text>

  <!-- Video track clips V1 -->
  <rect x="120" y="444" width="680" height="30" fill="#0e0e16"/>
  <rect x="130" y="447" width="160" height="24" rx="3" fill="#1a3a6c" stroke="#3b82f6" stroke-width="1"/>
  <text x="138" y="462" font-family="monospace" font-size="8" fill="#7aa7e0">scene_01  ████████</text>
  <rect x="295" y="447" width="120" height="24" rx="3" fill="#2d1060" stroke="#a855f7" stroke-width="1"/>
  <text x="303" y="462" font-family="monospace" font-size="8" fill="#c084fc">scene_02  ██████</text>
  <rect x="420" y="447" width="200" height="24" rx="3" fill="#1a3a6c" stroke="#3b82f6" stroke-width="1"/>
  <text x="428" y="462" font-family="monospace" font-size="8" fill="#7aa7e0">scene_03  ██████████</text>
  <rect x="625" y="447" width="140" height="24" rx="3" fill="#2d1060" stroke="#a855f7" stroke-width="1"/>
  <text x="633" y="462" font-family="monospace" font-size="8" fill="#c084fc">scene_04  ███████</text>

  <!-- Video track V2 (titles/overlays) -->
  <rect x="120" y="474" width="680" height="30" fill="#0e0e16"/>
  <rect x="280" y="477" width="80" height="24" rx="3" fill="#14300a" stroke="#22c55e" stroke-width="1"/>
  <text x="288" y="492" font-family="monospace" font-size="8" fill="#86efac">TITLE</text>
  <rect x="500" y="477" width="60" height="24" rx="3" fill="#14300a" stroke="#22c55e" stroke-width="1"/>
  <text x="508" y="492" font-family="monospace" font-size="8" fill="#86efac">CREDIT</text>

  <!-- Audio track A1 -->
  <rect x="120" y="504" width="680" height="30" fill="#0e0e16"/>
  <rect x="130" y="507" width="660" height="24" rx="3" fill="#2a1a00" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
  <!-- Waveform -->
  <polyline points="135,519 145,511 155,523 165,509 175,521 185,513 195,519 210,508 225,522 240,510 255,520 270,512 285,519 300,507 315,521 330,511 345,519 360,508 375,522 390,510 405,519 420,508 435,522 450,512 465,519 480,509 495,521 510,511 525,519 540,508 555,521 570,511 585,519 600,509 615,521 630,511 645,519 660,509 675,521 685,515 690,519" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.7"/>
  <text x="138" y="525" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.6">ambient_drone.wav</text>

  <!-- Audio track A2 -->
  <rect x="120" y="534" width="680" height="28" fill="#0e0e16"/>
  <rect x="130" y="537" width="200" height="20" rx="3" fill="#1a1a2a" stroke="#6366f1" stroke-width="1" opacity="0.8"/>
  <polyline points="135,547 142,541 150,551 158,543 166,549 174,542 182,547 190,542 198,549 205,544 212,547 220,541 228,549 230,547" stroke="#6366f1" stroke-width="1" fill="none" opacity="0.7"/>
  <text x="138" y="552" font-family="monospace" font-size="7" fill="#818cf8" opacity="0.6">score_01.wav</text>

  <!-- Playhead -->
  <line x1="380" y1="416" x2="380" y2="562" stroke="#ff4444" stroke-width="1.5" opacity="0.8"/>
  <polygon points="373,416 387,416 380,424" fill="#ff4444" opacity="0.9"/>

  <!-- Auto-edit status badge -->
  <rect x="648" y="424" width="140" height="20" rx="3" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="718" y="437" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">AUTO-EDIT ACTIVE</text>
  <circle cx="656" cy="434" r="3" fill="#a855f7">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
